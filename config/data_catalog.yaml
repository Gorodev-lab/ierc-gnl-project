      gold_path: "curated/tnc/bajos_marinos_h3_8/"
    quality:
      expectations:
        - "expect_table_row_count_to_be_between: {min_value: 10, max_value: 1000}"
        - "expect_column_values_to_not_be_null: [nombre, geometry]"
