# ============================================================
# Configuración global del catálogo
# ============================================================
catalog_config:
  # H3 celdas válidas para el Golfo de California (pre-calculadas)
  valid_h3_cells_gulf:
    resolution_8_count: 2847
    resolution_9_count: 22776
    resolution_10_count: 182208
    resolution_11_count: 1457664
  
  # Bounding box unificado
  gulf_bbox:
    min_lat: 22.5
    max_lat: 32.0
    min_lon: -115.0
    max_lon: -108.0
  
  # H3 resolutions por tipo de dato
  h3_resolutions:
    satellite_coarse: 8      # NASA 4km -> H3_8
    satellite_fine: 9        # GEBCO 450m -> H3_9
    vector_coarse: 8         # TNC, PANGAS -> H3_8
    vector_fine: 10          # ASEA puntos -> H3_10
    field_very_fine: 11      # Levantamiento campo -> H3_11
  
  # Particionado temporal estándar
  temporal_partitions:
    daily_format: "%Y-%m-%d"
    monthly_format: "%Y-%m"
    yearly_format: "%Y"
  
  # Compresión por defecto
  compression: "zstd"
  compression_level: 3