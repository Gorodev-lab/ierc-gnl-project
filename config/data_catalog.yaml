# Catálogo de Datos IERC-GNL
# ===========================
# Define todos los datasets disponibles, sus metadatos, esquemas y linaje

datasets:
  # ============================================================
  # NASA OceanColor - Clorofila-a y SST
  # ============================================================
  nasa_chlor_a:
    name: "NASA OceanColor Clorofila-a"
    description: "Concentración de clorofila-a superficial (mg/m³) del sensor MODIS-Aqua, resolución 4km diaria"
    source:
      type: "api"
      url: "https://oceandata.sci.gsfc.nasa.gov/opendap/MODISA/L3SMI/2024/001/A2024001.L3m_DAY_CHL_chlor_a_4km.nc"
      auth_required: false
    format: "netcdf"
    crs: "EPSG:4326"
    temporal:
      frequency: "daily"
      range: ["2020-01-01", "2024-12-31"]
      partition_column: "time_partition"  # YYYY-MM
    spatial:
      bbox: [22.5, -115.0, 32.0, -108.0]  # [min_lat, min_lon, max_lat, max_lon]
      native_resolution_km: 4
      h3_resolution: 8
    schema:
      variables:
        - name: "chlor_a"
          dtype: "float32"
          units: "mg/m³"
          valid_range: [0.0, 100.0]
          fill_value: -32767
        - name: "quality_flag"
          dtype: "uint8"
          description: "Bandera de calidad del pixel"
      dimensions:
        - name: "time"
          dtype: "datetime64[ns]"
        - name: "lat"
          dtype: "float32"
        - name: "lon"
          dtype: "float32"
      derived_columns:
        - name: "h3_cell_8"
          dtype: "string"
          description: "Celda H3 nivel 8"
        - name: "time_partition"
          dtype: "string"
          description: "Partición temporal YYYY-MM"
    lakehouse:
      bronze_path: "raw/nasa/chlor_a/{year}/{month}/"
      silver_path: "processed/nasa/chlor_a/year={year}/month={month:02d}/h3_8={h3_cell_8}/"
      gold_path: "curated/nasa/chlor_a_monthly_h3_8/"
    quality:
      expectations:
        - "expect_table_row_count_to_be_between: {min_value: 1000, max_value: 500000}"
        - "expect_column_values_to_not_be_null: chlor_a"
        - "expect_column_values_to_be_between: {column: chlor_a, min_value: 0.0, max_value: 50.0}"
        - "expect_column_values_to_be_in_set: {column: h3_cell_8, value_set: $valid_h3_cells_gulf}"
      freshness:
        max_lag_days: 7
    priority: "critical"
    tags: ["environmental", "satellite", "timeseries", "chlorophyll"]
  
  nasa_sst:
    name: "NASA OceanColor Temperatura Superficial del Mar"
    description: "SST diaria MODIS-Aqua, resolución 4km"
    source:
      type: "api"
      url: "https://oceandata.sci.gsfc.nasa.gov/opendap/MODISA/L3SMI/2024/001/A2024001.L3m_DAY_SST_sst_4km.nc"
      auth_required: false
    format: "netcdf"
    crs: "EPSG:4326"
    temporal:
      frequency: "daily"
      range: ["2020-01-01", "2024-12-31"]
      partition_column: "time_partition"
    spatial:
      bbox: [22.5, -115.0, 32.0, -108.0]
      native_resolution_km: 4
      h3_resolution: 8
    schema:
      variables:
        - name: "sst"
          dtype: "float32"
          units: "°C"
          valid_range: [-2.0, 40.0]
          fill_value: -32767
      dimensions:
        - name: "time"
          dtype: "datetime64[ns]"
        - name: "lat"
          dtype: "float32"
        - name: "lon"
          dtype: "float32"
      derived_columns:
        - name: "h3_cell_8"
          dtype: "string"
        - name: "time_partition"
          dtype: "string"
    lakehouse:
      bronze_path: "raw/nasa/sst/{year}/{month}/"
      silver_path: "processed/nasa/sst/year={year}/month={month:02d}/h3_8={h3_cell_8}/"
      gold_path: "curated/nasa/sst_monthly_h3_8/"
    quality:
      expectations:
        - "expect_table_row_count_to_be_between: {min_value: 1000, max_value: 500000}"
        - "expect_column_values_to_not_be_null: sst"
        - "expect_column_values_to_be_between: {column: sst, min_value: 10.0, max_value: 35.0}"
      freshness:
        max_lag_days: 7
    priority: "critical"
    tags: ["environmental", "satellite", "timeseries", "temperature"]
  
  # ============================================================
  # Global Fishing Watch - Esfuerzo Pesquero
  # ============================================================
  gfw_fishing_effort:
    name: "Global Fishing Watch - Esfuerzo Pesquero Aparente v3.0"
    description: "Horas de pesca aparente por celda 0.01° x 0.01°, derivado de AIS"
    source:
      type: "zenodo"
      record_id: "14982712"
      files:
        - "fishing-vessels-v3.csv"           # Metadatos embarcaciones
        - "fleet-daily-csvs-100-v3-2020.zip" # Esfuerzo diario 2020
        - "fleet-daily-csvs-100-v3-2021.zip" # Esfuerzo diario 2021
        - "fleet-daily-csvs-100-v3-2022.zip" # Esfuerzo diario 2022
        - "fleet-daily-csvs-100-v3-2023.zip" # Esfuerzo diario 2023
    format: "csv_zip"
    crs: "EPSG:4326"
    temporal:
      frequency: "daily"
      range: ["2012-01-01", "2023-12-31"]
      partition_column: "date_partition"  # YYYY-MM-DD
    spatial:
      bbox: [22.5, -115.0, 32.0, -108.0]
      native_resolution_deg: 0.01
      h3_resolution: 8
    schema:
      columns:
        - name: "date"
          dtype: "date"
        - name: "lat"
          dtype: "float32"
        - name: "lon"
          dtype: "float32"
        - name: "fishing_hours"
          dtype: "float32"
          units: "hours"
        - name: "mmsi"
          dtype: "string"
        - name: "gear_type"
          dtype: "string"
          categories: ["trawlers", "longliners", "purse_seines", "fixed_gear", "other"]
        - name: "flag"
          dtype: "string"
      derived_columns:
        - name: "h3_cell_8"
          dtype: "string"
        - name: "year"
          dtype: "int16"
        - name: "month"
          dtype: "int8"
        - name: "date_partition"
          dtype: "string"
    lakehouse:
      bronze_path: "raw/gfw/fishing_effort/{year}/"
      silver_path: "processed/gfw/fishing_effort_h3/year={year}/month={month:02d}/h3_8={h3_cell_8}/"
      gold_path: "curated/gfw/fishing_effort_monthly_h3_8/"
    quality:
      expectations:
        - "expect_table_row_count_to_be_between: {min_value: 10000, max_value: 10000000}"
        - "expect_column_values_to_not_be_null: [date, lat, lon, fishing_hours, mmsi]"
        - "expect_column_values_to_be_between: {column: fishing_hours, min_value: 0.0, max_value: 720.0}"
        - "expect_column_values_to_be_in_set: {column: gear_type, value_set: [trawlers, longliners, purse_seines, fixed_gear, other]}"
      freshness:
        max_lag_days: 365  # Actualización anual
    priority: "critical"
    tags: ["fisheries", "ais", "timeseries", "human_activity"]
    size_estimate_gb: 5100  # 5.1 TB total, ~100GB para Golfo
  
  gfw_vessels:
    name: "Global Fishing Watch - Registro de Embarcaciones"
    description: "Metadatos de embarcaciones pesqueras (MMSI, tipo, bandera, eslora)"
    source:
      type: "zenodo"
      record_id: "14982712"
      file: "fishing-vessels-v3.csv"
    format: "csv"
    schema:
      columns:
        - name: "mmsi"
          dtype: "string"
          primary_key: true
        - name: "vessel_name"
          dtype: "string"
        - name: "ship_type"
          dtype: "string"
        - name: "gear_type"
          dtype: "string"
        - name: "flag"
          dtype: "string"
        - name: "length_m"
          dtype: "float32"
        - name: "tonnage_gt"
          dtype: "float32"
    lakehouse:
      bronze_path: "raw/gfw/vessels/"
      silver_path: "processed/gfw/vessels/"
      gold_path: "curated/gfw/vessels/"
    quality:
      expectations:
        - "expect_column_values_to_not_be_null: mmsi"
        - "expect_column_values_to_be_unique: mmsi"
    priority: "high"
    tags: ["fisheries", "reference", "vessels"]
  
