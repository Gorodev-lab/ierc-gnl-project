    format: "shapefile_zip"
    crs: "EPSG:4326"
    temporal:
      frequency: "static"
      last_updated: "2024-01-15"
    spatial:
      geometry_type: "Polygon"
      h3_resolution: 8
    schema:
      properties:
        - name: "objectid"
          dtype: "int64"
        - name: "nombre"
          dtype: "string"
        - name: "area_km2"
          dtype: "float64"
      derived_columns:
        - name: "h3_cell_8"
          dtype: "string"
        - name: "area_frac"
          dtype: "float32"
    lakehouse:
      bronze_path: "raw/tnc/arrecifes_coral_negro/"
      silver_path: "processed/tnc/arrecifes_coral_negro_h3/h3_8={h3_cell_8}/"
      gold_path: "curated/tnc/arrecifes_coral_negro_h3_8/"
    quality:
      expectations:
        - "expect_table_row_count_to_be_between: {min_value: 1, max_value: 500}"
    priority: "high"
    tags: ["conservation", "biodiversity", "static", "vector"]
  
  # ============================================================
  # ASEA - Manifestaciones de Impacto Ambiental
  # ============================================================
  asea_mias_consolidated:
    name: "ASEA - Proyectos GNL/Gas Natural Consolidados"
    description: "Proyectos de infraestructura GNL y gasoductos en el Golfo (ASEA + CENAGAS + SENER)"
    source:
      type: "file"
      path: "/home/gorops/ierc-gnl-project/causanaturadata/output/gnl_proyectos_consolidados.csv"
    format: "csv"
    crs: "EPSG:4326"
    temporal:
      frequency: "incremental_weekly"
      last_updated: "2024-07-30"
    spatial:
      geometry_type: "Point"
      h3_resolution: 10
    schema:
      columns:
        - name: "proyecto_id"
          dtype: "string"
          primary_key: true
        - name: "nombre"
          dtype: "string"
        - name: "estado"
          dtype: "string"
        - name: "tipo_proyecto"
          dtype: "string"
          categories: ["terminal_gnl", "gasoducto_transporte", "gasoducto_distribucion", "planta_licuefaccion", "estacion_compresion"]
        - name: "fuente"
          dtype: "string"
          categories: ["ASEA", "CENAGAS", "SENER", "Plan_Quinquenal_2025-29"]
        - name: "lat"
          dtype: "float64"
        - name: "lon"
          dtype: "float64"
        - name: "estatus"
          dtype: "string"
          categories: ["En_operacion", "En_construccion", "En_planeacion", "Autorizado", "En_evaluacion"]
        - name: "capacidad_mtpa"
          dtype: "float32"
        - name: "longitud_km"
          dtype: "float32"
        - name: "folio_asea"
          dtype: "string"
        - name: "pdf_url"
          dtype: "string"
      derived_columns:
        - name: "h3_cell_10"
          dtype: "string"
        - name: "ingestion_timestamp"
          dtype: "datetime64[ns]"
        - name: "content_hash"
          dtype: "string"
    lakehouse:
      bronze_path: "raw/asea/mias_consolidated/"
      silver_path: "processed/asea/mias_enriched/h3_10={h3_cell_10}/"
      gold_path: "curated/asea/mias_gnl_gulf/"
    quality:
      expectations:
        - "expect_column_values_to_not_be_null: [proyecto_id, nombre, lat, lon, tipo_proyecto]"
        - "expect_column_values_to_be_unique: proyecto_id"
        - "expect_column_values_to_be_between: {column: lat, min_value: 22.5, max_value: 32.0}"
        - "expect_column_values_to_be_between: {column: lon, min_value: -115.0, max_value: -108.0}"
      cdc:
        enabled: true
        key_column: "proyecto_id"
        hash_columns: ["nombre", "estatus", "tipo_proyecto", "capacidad_mtpa"]
    priority: "critical"
    tags: ["infrastructure", "gnl", "regulatory", "incremental", "point"]
  
  # ============================================================
  # Batimetría - ETOPO1 y GEBCO
  # ============================================================
  bathymetry_etopo1:
    name: "Batimetría ETOPO1 - Golfo de California"
    description: "Modelo de elevación global 1 arc-min (~1.8km) recortado al Golfo"
    source:
      type: "file"
      path: "/home/gorops/ierc-gnl-project/causanaturadata/batimetria/ETOPO1_Gulf_California.tif"
    format: "geotiff"
    crs: "EPSG:4326"
    temporal:
      frequency: "static"
      last_updated: "2024-01-01"
    spatial:
      resolution_deg: 0.0166667  # 1 arc-min
      h3_resolutions: [8, 9, 10]
      bbox: [22.5, -115.0, 32.0, -108.0]
    schema:
      stats: ["mean", "min", "max", "std", "count"]
      derived_columns:
        - name: "h3_cell"
          dtype: "string"
        - name: "resolution"
          dtype: "int8"
        - name: "depth_mean_m"
          dtype: "float32"
        - name: "depth_min_m"
          dtype: "float32"
        - name: "depth_max_m"
          dtype: "float32"
        - name: "depth_std_m"
          dtype: "float32"
        - name: "pixel_count"
          dtype: "int32"
    lakehouse:
      bronze_path: "raw/bathymetry/etopo1/"
      silver_path: "processed/bathymetry/etopo1_h3/h3_{resolution}={h3_cell}/"
      gold_path: "curated/bathymetry/etopo1_multi_res/"
    quality:
      expectations:
        - "expect_column_values_to_not_be_null: [h3_cell, depth_mean_m]"
        - "expect_column_values_to_be_between: {column: depth_mean_m, min_value: -5000, max_value: 0}"
    priority: "high"
    tags: ["bathymetry", "raster", "static", "multi_resolution"]
  
  bathymetry_gebco:
    name: "Batimetría GEBCO 2024 - Golfo de California"
    description: "Modelo batimétrico global 15 arc-sec (~450m) - vectorizado en contornos"
    source:
      type: "file"
      path: "/home/gorops/ierc-gnl-project/causanaturadata/output/GEBCO_Batimetria_Golfo.gpkg"
    format: "geopackage"
    crs: "EPSG:4326"
    temporal:
      frequency: "static"
      last_updated: "2024-07-30"
    spatial:
      geometry_type: "Polygon"
      h3_resolutions: [8, 9, 10]
    schema:
      properties:
        - name: "depth_range"
          dtype: "string"
        - name: "depth_min_m"
          dtype: "int32"
        - name: "depth_max_m"
          dtype: "int32"
        - name: "area_km2"
          dtype: "float64"
      derived_columns:
        - name: "h3_cell"
          dtype: "string"
        - name: "resolution"
          dtype: "int8"
        - name: "area_frac"
          dtype: "float32"
    lakehouse:
      bronze_path: "raw/bathymetry/gebco/"
      silver_path: "processed/bathymetry/gebco_h3/h3_{resolution}={h3_cell}/"
      gold_path: "curated/bathymetry/gebco_multi_res/"
    quality:
      expectations:
        - "expect_column_values_to_not_be_null: [depth_min_m, depth_max_m]"
    priority: "medium"
    tags: ["bathymetry", "vector", "contours", "static"]
  
