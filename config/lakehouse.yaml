# Configuración del Lakehouse IERC-GNL
# =====================================

lakehouse:
  # Raíz del lakehouse (local filesystem compatible S3)
  root_path: "lakehouse"
  
  # Capas del lakehouse (Medallion Architecture)
  layers:
    bronze: "raw"       # Datos tal cual llegan (inmutables)
    silver: "processed" # Limpio, enriquecido, particionado H3
    gold: "curated"     # Listo para análisis/ML/dashboard
  
  # Formatos por defecto
  formats:
    tabular: "parquet"        # Compresión zstd
    spatial: "geoparquet"     # GeoPandas compatible
    raster: "parquet"         # Raster stats por H3
  
  # Compresión
  compression: "zstd"
  compression_level: 3
  
  # Particionado espacial por defecto
  spatial_partitioning:
    h3_resolution_default: 8      # ~0.73 km² mar abierto
    h3_resolution_coastal: 10     # ~0.015 km² zonas costeras/portuarias
    h3_resolution_fine: 11        # ~0.0037 km² detalle máximo
  
  # Particionado temporal
  temporal_partitioning:
    frequency: "monthly"          # daily, monthly, yearly
    column: "time_partition"      # Formato: YYYY-MM
  
  # Catálogo
  catalog:
    path: "lakehouse/metadata/catalog.json"
    backup_retention_days: 30

# Configuración de fuentes de datos
data_sources:
  nasa_oceancolor:
    enabled: true
    base_url: "https://oceandata.sci.gsfc.nasa.gov"
    variables: ["chlor_a", "sst"]
    temporal_range:
      start: "2020-01-01"
      end: "2024-12-31"
    bbox_gulf_california:
      min_lat: 22.5
      max_lat: 32.0
      min_lon: -115.0
      max_lon: -108.0
    chunk_size:
      time: 1
      lat: 500
      lon: 500
  
  gfw_fishing_effort:
    enabled: true
    source_path: "data/raw/gfw"
    zenodo_record_id: "14982712"
    target_years: [2020, 2021, 2022, 2023]
    h3_resolution: 8
  
  tnc_conservation:
    enabled: true
    source_path: "data/raw/tnc"
    layers:
      - "bajos_marinos"
      - "arrecifes_coral_negro"
    h3_resolution: 8
  
  asea_mias:
    enabled: true
    source_path: "causanaturadata/output"
    files:
      - "gnl_proyectos_consolidados.csv"
      - "asea_mias_alto_golfo.csv"
    cdc_enabled: true
    h3_resolution: 10  # Mayor resolución para infraestructura puntual
  
  bathymetry:
    enabled: true
    source_path: "causanaturadata/batimetria"
    files:
      - "ETOPO1_Gulf_California.tif"
    h3_resolutions: [8, 9, 10]
    stats: ["mean", "min", "max", "std"]

# Bounding Box Golfo de California (WGS84/EPSG:4326)
gulf_bbox:
  min_lat: 22.5
  max_lat: 32.0
  min_lon: -115.0
  max_lon: -108.0

# Configuración de calidad
quality:
  enabled: true
  great_expectations_path: "great_expectations"
  notification:
    enabled: false
    # webhook_url: "https://hooks.slack.com/services/..."

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/lakehouse.log"
  max_bytes: 10485760
  backup_count: 5