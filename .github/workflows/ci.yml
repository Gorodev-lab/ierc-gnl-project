name: IERC-GNL CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHONPATH: .

jobs:
  test:
    name: Unit Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short

      - name: Verify test count
        run: |
          python -m pytest tests/unit/ --collect-only -q | tail -1

  lint:
    name: Syntax & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python syntax on core modules
        run: |
          python -m py_compile \
            src/data/ingestion/base.py \
            src/data/ingestion/factory.py \
            src/data/catalog/catalog.py \
            src/data/ingestion/asea_mias.py \
            src/data/lakehouse/storage.py \
            src/utils/h3.py \
            src/utils/standardize.py \
            src/utils/logging.py \
            src/engine/spatial_validator.py \
            src/engine/responsible_ai.py \
            src/engine/ierc_calculator.py \
            src/engine/monte_carlo_engine.py
          echo "Syntax OK on all core modules"

  verify-cdc:
    name: CDC + Schema Contract Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CDC exact-once + Schema contract verification
        run: |
          python scripts/ci_verify_cdc.py

  dashboard-build:
    name: Dashboard Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, lint, verify-cdc, dashboard-build]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "=== CI Pipeline Summary ==="
          echo "Test: ${{ needs.test.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "CDC/Schema: ${{ needs.verify-cdc.result }}"
          echo "Dashboard Build: ${{ needs.dashboard-build.result }}"
          
          if [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.verify-cdc.result }}" != "success" ]] || \
             [[ "${{ needs.dashboard-build.result }}" != "success" ]]; then
            echo "CI FAILED"
            exit 1
          else
            echo "CI PASSED"
          fi

  deploy-vercel:
    name: Deploy Dashboard to Vercel
    runs-on: ubuntu-latest
    needs: [test, lint, verify-cdc, dashboard-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: |
          cd dashboard
          npm run build

      - name: Deploy to Vercel
        run: |
          cd dashboard
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}